services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vendaflow
      POSTGRES_PASSWORD: vendaflow
      POSTGRES_DB: vendaflow
    ports: ["5432:5432"]
    volumes: [vendaflow_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  vendaflow_pg:
